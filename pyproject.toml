[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daicp"
version = "0.1.0"
description = "Local data auditing and LLM integration for DAICP"
requires-python = ">=3.12"
dependencies = [
    "ollama==0.6.3",
    "pandas==3.0.6",
    "plotly==7.1.0",
]

[project.optional-dependencies]
audit = [
    "numpy==2.5.3",
    "ipykernel==7.3.0",
    "nbformat==5.11.1",
]
dev = [
    "import-linter==2.15",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["daicp", "daicp.*"]
namespaces = false

[tool.importlinter]
root_package = "daicp"

[[tool.importlinter.contracts]]
name = "El backend no importa procesos offline"
type = "forbidden"
source_modules = ["daicp.backend"]
forbidden_modules = ["daicp.offline"]
